<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Latest OpenSillicon project releases and updates.">
  <title>News — OpenSillicon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="detail">
  <header><h1>OpenSillicon</h1><p><a href="index.html">home</a></p></header>
  <main>
    <section class="copy" id="news">
      <h2>News</h2>
      <p id="news-status" role="status">Loading project releases…</p>
      <ol id="news-list"></ol>
      <noscript><p>Enable JavaScript to load releases from GitHub.</p></noscript>
      <p><a href="https://github.com/uriyovsiannikov/OpenSillicon/releases">All releases on GitHub</a></p>
    </section>
  </main>
  <script>
    const status = document.querySelector('#news-status');
    const list = document.querySelector('#news-list');

    fetch('https://api.github.com/repos/uriyovsiannikov/OpenSillicon/releases?per_page=10', {
      headers: { Accept: 'application/vnd.github+json' }
    })
      .then(response => {
        if (!response.ok) throw new Error(`GitHub returned ${response.status}`);
        return response.json();
      })
      .then(releases => {
        status.textContent = releases.length ? '' : 'No releases have been published yet.';
        for (const release of releases) {
          const item = document.createElement('li');
          const link = document.createElement('a');
          const date = document.createElement('time');
          link.href = release.html_url;
          link.textContent = release.name || release.tag_name;
          date.dateTime = release.published_at;
          date.textContent = ` — ${new Date(release.published_at).toLocaleDateString()}`;
          item.append(link, date);
          list.append(item);
        }
      })
      .catch(() => {
        status.textContent = 'Could not load news right now. You can browse releases on GitHub.';
      });
  </script>
</body>
</html>
